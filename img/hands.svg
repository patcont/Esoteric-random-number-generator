      <!-- fingers, nails red -->
      <g fill="url(#hand)">
        <rect x="80" y="20" width="11" height="40" rx="5.5" transform="rotate(30 85 40)"/>
        <rect x="90" y="30" width="11" height="44" rx="5.5" transform="rotate(52 95 52)"/>
        <rect x="92" y="50" width="11" height="40" rx="5.5" transform="rotate(74 97 70)"/>
        <rect x="86" y="70" width="10" height="32" rx="5" transform="rotate(98 91 86)"/>
        <rect x="56" y="34" width="11" height="34" rx="5.5" transform="rotate(-8 61 51)"/>
      </g>
      <g fill="#c2185b">
        <ellipse cx="98.5" cy="26.5" rx="4" ry="5" transform="rotate(30 98.5 26.5)"/>
        <ellipse cx="114" cy="40" rx="4" ry="5" transform="rotate(52 114 40)"/>
        <ellipse cx="121" cy="64" rx="4" ry="5" transform="rotate(74 121 64)"/>
        <ellipse cx="114" cy="88" rx="3.6" ry="4.6" transform="rotate(98 114 88)"/>
