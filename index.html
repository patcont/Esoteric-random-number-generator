<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Ask the crystal ball for your lucky number of the day." />
  <title>What is your lucky number today?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="main.js" type="module"></script>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="glow left" aria-hidden="true"></div>
  <div class="glow right" aria-hidden="true"></div>

  <button id="sound" class="sound" aria-pressed="false" title="Ambient sound">🔇</button>

  <main>
    <h1>What is your lucky number today?</h1>

    <div class="scene">
      <div class="torch left" aria-hidden="true">
        <div class="flame"><i></i><i></i><i></i></div>
        <img src="img/torch.svg" alt="" />
      </div>

      <div class="stage">
        <img class="witch" src="img/witch.svg" alt="A fortune teller with a colorful headscarf gazing into her crystal ball" />
        <div class="ball" id="ball">
          <span class="number" id="number" aria-live="polite">?</span>
        </div>
        <img class="hands" src="img/hands.svg" alt="" aria-hidden="true" />
      </div>

      <div class="torch right" aria-hidden="true">
        <div class="flame"><i></i><i></i><i></i></div>
        <img src="img/torch.svg" alt="" />
      </div>
    </div>

    <p class="omen" id="omen">The spirits are waiting for your question…</p>

    <button id="ask" class="ask">Let the gods decide</button>
  </main>
</body>
</html>
